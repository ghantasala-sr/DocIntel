<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocIntel Agent</title>
<style>
  :root { --bg:#0f1216; --card:#171b21; --muted:#8b96a5; --text:#e6eaf0; --accent:#4f9cf9; --line:#252b33; --user:#1f6feb22; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:3px 0 0; color:var(--muted); font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin-bottom:16px; display:flex; }
  .msg .bubble { padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.5; white-space:pre-wrap; max-width:80%; }
  .msg.user { justify-content:flex-end; }
  .msg.user .bubble { background:var(--user); border:1px solid var(--accent); }
  .msg.agent .bubble { background:var(--card); border:1px solid var(--line); }
  .msg.agent .bubble.thinking { color:var(--muted); font-style:italic; }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:11px 14px; font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); font-size:12px; padding:0 20px 8px; max-width:820px; width:100%; margin:0 auto; }
</style>
</head>
<body>
<header>
  <h1>DocIntel Agent</h1>
  <p>Ask about company financials (BigQuery) or the handbook (vector search) — the agent picks the tool.</p>
</header>
<div id="log"></div>
<div class="hint">Try: "Which company had the highest revenue in 2024?" or "How is data secured?"</div>
<form id="form" onsubmit="return send(event)">
  <input id="q" placeholder="Ask the agent…" autocomplete="off" />
  <button id="btn" type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
function add(role, text, cls) {
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  const b = document.createElement('div');
  b.className = 'bubble ' + (cls || '');
  b.textContent = text;
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}
async function send(e) {
  e.preventDefault();
  const input = document.getElementById('q');
  const btn = document.getElementById('btn');
  const q = input.value.trim();
  if (!q) return false;
  add('user', q);
  input.value = '';
  btn.disabled = true;
  const thinking = add('agent', 'thinking…', 'thinking');
  try {
    const res = await fetch('/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    const data = await res.json();
    thinking.classList.remove('thinking');
    thinking.textContent = data.answer || JSON.stringify(data);
  } catch (err) {
    thinking.classList.remove('thinking');
    thinking.textContent = 'Error: ' + err;
  } finally {
    btn.disabled = false;
    input.focus();
  }
  return false;
}
</script>
</body>
</html>
